name: Process next firmware (manual)

on:
  workflow_dispatch:
    inputs:
      codename:
        description: Device codename to process (example X6896). Leave blank for next available.
        required: false
        default: ''
        type: string
      region:
        description: Optional region filter (example IN or OP)
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: transsion-data-writes
  cancel-in-progress: false

jobs:
  ingest-next:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select next full firmware
        id: select
        shell: bash
        env:
          CODENAME_FILTER: ${{ inputs.codename }}
          REGION_FILTER: ${{ inputs.region }}
        run: |
          set +e
          cmd=(python scripts/ingestion_queue.py select \
            data/firmware_sources.json \
            data/ingestion_state.json \
            selected-source.json)
          if [ -n "$CODENAME_FILTER" ]; then
            cmd+=(--codename "$CODENAME_FILTER")
          fi
          if [ -n "$REGION_FILTER" ]; then
            cmd+=(--region "$REGION_FILTER")
          fi
          "${cmd[@]}"
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "selected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "selected=true" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.select.outputs.selected == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install firmware tools
        if: steps.select.outputs.selected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs erofs-utils liblzma-dev
          go install github.com/xishang0128/payload-dumper-go/cmd/payload-dumper@v0.1.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root is not available on this runner" >&2
            exit 1
          fi
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS" ]; then
            echo "Android SDK build-tools not found" >&2
            exit 1
          fi
          echo "$BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Stream and extract firmware apps
        id: ingest
        if: steps.select.outputs.selected == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="$(python -c "import json; print(json.load(open('selected-source.json'))['url'])")"
          python firmware/ingest_firmware.py "$SOURCE_URL" \
            --workdir firmware-work \
            --output ingest-result.json

      - name: Scan staged APK metadata
        id: scan
        if: steps.select.outputs.selected == 'true' && steps.ingest.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BRAND="$(python -c "import json; print(json.load(open('selected-source.json'))['brand'])")"
          DEVICE="$(python -c "import json; print(json.load(open('selected-source.json'))['device'])")"
          CODENAME="$(python -c "import json; print(json.load(open('selected-source.json'))['codename'])")"
          REGION="$(python -c "import json; print(json.load(open('selected-source.json'))['region'])")"
          BUILD="$(python -c "import json; print(json.load(open('selected-source.json'))['sourceBuild'])")"
          python scanner/scan_apks.py firmware-work/apks \
            --brand "$BRAND" \
            --device "$DEVICE" \
            --codename "$CODENAME" \
            --region "$REGION" \
            --build "$BUILD" \
            --output scan-result.json

      - name: Merge app catalog
        id: merge
        if: steps.select.outputs.selected == 'true' && steps.scan.outcome == 'success'
        continue-on-error: true
        run: python scripts/merge_catalog.py scan-result.json data/catalog.json

      - name: Record ingestion outcome
        if: steps.select.outputs.selected == 'true' && always()
        shell: bash
        env:
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          set -euo pipefail
          if [ "$INGEST_OUTCOME" = "success" ] && [ "$SCAN_OUTCOME" = "success" ] && [ "$MERGE_OUTCOME" = "success" ]; then
            status=success
          else
            status=failed
            git checkout -- data/catalog.json || true
            {
              echo "ingest=$INGEST_OUTCOME"
              echo "scan=$SCAN_OUTCOME"
              echo "merge=$MERGE_OUTCOME"
              if [ -f ingest-result.json ]; then
                cat ingest-result.json
              fi
            } > failure-summary.txt
          fi

          if [ "$status" = "success" ]; then
            python scripts/ingestion_queue.py mark \
              selected-source.json data/ingestion_state.json --status success
          else
            python scripts/ingestion_queue.py mark \
              selected-source.json data/ingestion_state.json --status failed \
              --error-file failure-summary.txt
          fi

      - name: Commit catalog and queue state
        if: steps.select.outputs.selected == 'true' && always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/catalog.json data/ingestion_state.json; then
            echo "No catalog/state changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/ingestion_state.json
          git commit -m "Process firmware app catalog source"
          git push

      - name: Upload extracted APKs
        if: always() && steps.select.outputs.selected == 'true' && steps.ingest.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-apks-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: firmware-work/apks/

      - name: Upload ingestion reports
        if: steps.select.outputs.selected == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-scan-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            selected-source.json
            ingest-result.json
            scan-result.json
            failure-summary.txt

      - name: Fail run when ingestion failed
        if: steps.select.outputs.selected == 'true' && always()
        shell: bash
        env:
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          if [ "$INGEST_OUTCOME" != "success" ] || [ "$SCAN_OUTCOME" != "success" ] || [ "$MERGE_OUTCOME" != "success" ]; then
            echo "Firmware ingestion did not complete successfully"
            exit 1
          fi
